<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>群聊修复 · 全流程预览</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#edf0e9;color:#272d26;font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"PingFang SC",sans-serif}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:2px solid #53684f;outline-offset:3px}button:disabled{cursor:default;opacity:.4}.top{height:82px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 26px;border-bottom:1px solid #d7ddd1}.brand{display:flex;align-items:center;gap:12px}.mark{width:34px;height:34px;background:#34462f;color:#f7f9f0;border-radius:50%;display:grid;place-items:center;font-size:18px}.brand h1{font-size:19px;font-weight:620;letter-spacing:-.4px;margin:0}.brand p{font-size:12px;color:#6c7566;margin:3px 0 0}.actions{display:flex;align-items:center;gap:8px}.plain{border:1px solid #cfd6c8;background:transparent;border-radius:8px;padding:7px 12px;font-size:12px}.primary{border-color:#34462f;background:#34462f;color:#f8faef}.workspace{display:grid;grid-template-columns:214px minmax(0,1fr);gap:24px;padding:22px 26px 20px;min-height:calc(100dvh - 82px)}.rail-label{font-size:11px;font-weight:600;letter-spacing:1.5px;color:#6b7663;margin:0 0 13px;padding-left:10px}.scenes{display:flex;flex-direction:column;gap:5px}.scene{display:flex;gap:12px;width:100%;border:0;border-radius:10px;background:transparent;text-align:left;padding:12px 10px;align-items:baseline}.scene:hover{background:#e3e8dd}.scene[aria-pressed=true]{background:#dce4d4;color:#263a22}.number{font-size:11px;font-variant-numeric:tabular-nums;color:#798470}.scene[aria-pressed=true] .number{color:#405936}.scene strong{font-weight:580;font-size:13px;display:block}.scene small{font-size:11px;display:block;color:#6e7868;margin-top:3px}.scope{font-size:11px;line-height:1.8;color:#6c7566;margin:22px 10px 0;border-top:1px solid #d5dccf;padding-top:15px}.main{min-width:0;display:flex;flex-direction:column;gap:12px}.heading{display:flex;align-items:flex-end;justify-content:space-between;gap:18px}.heading h2{font-size:17px;font-weight:620;margin:0}.eyebrow{font-size:10px;letter-spacing:1.8px;color:#727d68;margin:0 0 3px}.counter{font-size:12px;color:#6d7865;font-variant-numeric:tabular-nums}.stepbar{display:flex;gap:5px;flex-wrap:wrap;margin-top:2px}.step{border:1px solid #d0d7c9;border-radius:7px;background:transparent;font-size:11px;padding:5px 9px}.step[aria-current=step]{border-color:#53694b;color:#2c4327;background:#f8faf4}.stage{position:relative;min-width:0;border:1px solid #d6dcd0;background:#f3f3f3;border-radius:19px;overflow:hidden}.stage iframe{display:block;border:0;width:100%;height:max(590px,calc(100dvh - 301px));background:#f3f3f3}.loader{position:absolute;inset:0;z-index:1;background:#f3f3f3;display:grid;place-items:center;color:#8a9581;font-size:12px}.loader[hidden]{display:none}.explain{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:start;min-height:65px}.note{margin:0;color:#56624e;font-size:12px;line-height:1.8;max-width:880px}.controls{display:flex;align-items:center;gap:6px}.controls button{white-space:nowrap}.footer{font-size:10px;color:#7c8576;margin:0}.error{color:#a13025}.top-status{font-size:11px;color:#65745b;margin-right:5px}
@media(max-width:1040px){.workspace{grid-template-columns:180px minmax(0,1fr);gap:16px;padding:18px}.top{padding:0 18px}.scene{gap:8px;padding:10px 8px}.explain{grid-template-columns:1fr}.controls{justify-content:flex-end}.stage iframe{height:max(590px,calc(100dvh - 340px))}}@media(max-width:730px){.top{height:auto;min-height:86px;padding:14px 15px;flex-wrap:wrap;gap:10px}.brand h1{font-size:17px}.top-status{display:none}.actions{margin-left:46px}.workspace{display:block;padding:14px 10px}.rail-label,.scope{display:none}.scenes{flex-direction:row;overflow:auto;margin-bottom:18px;padding-bottom:7px}.scene{width:174px;flex:0 0 174px;align-items:center}.scene small{font-size:10px}.main{gap:10px}.stage{border-radius:15px}.stage iframe{height:740px}.heading{padding:0 4px}.heading h2{font-size:16px}.note{padding:0 4px}.explain{gap:9px}.brand p{font-size:11px}.stepbar{padding:0 4px}}
.top{position:sticky;top:0;z-index:10;background:#edf0e9}.workspace>aside{position:sticky;top:104px;align-self:start}@media(max-width:730px){.workspace>aside{position:static}}
</style>
<header class="top">
  <div class="brand"><div class="mark" aria-hidden="true">↳</div><div><h1>群聊修复 · 全流程预览</h1><p>实际群聊组件 · 可逐步查看，也能直接点停止按钮</p></div></div>
  <div class="actions"><span class="top-status" id="top-status">准备预览</span><button class="plain" id="theme">切换深色</button><button class="plain primary" id="play">▶ 播放全部流程</button></div>
</header>
<div class="workspace">
  <aside><p class="rail-label">选择一个过程</p><nav class="scenes" id="scenes" aria-label="预览流程"></nav><p class="scope">当前代码的显示效果<br><span id="scene-count"></span> 条流程 · <span id="count"></span> 个阶段<br><br>修复尚未安装到正式 App。<br>本页为隔离示例，不连接真实群聊，也不执行新闻任务。</p></aside>
  <main class="main">
    <div class="heading"><div><p class="eyebrow">SHOGGOTH / GROUP CHAT</p><h2 id="title"></h2></div><span class="counter" id="counter"></span></div>
    <nav class="stepbar" id="steps" aria-label="过程阶段"></nav>
    <div class="stage"><div class="loader" id="loader">正在载入群聊界面…</div><iframe id="frame" title="真实群聊组件预览"></iframe></div>
    <div class="explain"><div><p class="note" id="note"></p><p class="footer">预览使用现有群聊组件与文案。消息内容为合成示例。</p></div><div class="controls"><button class="plain" id="previous">← 上一步</button><button class="plain" id="next">下一步 →</button></div></div>
  </main>
</div>
<script type="module">
const scenes = await fetch("/scenes.json").then(response => response.json());
const $ = id => document.getElementById(id), frame = $("frame"), params = new URLSearchParams(location.search);
let sceneIndex = Math.max(0, scenes.findIndex(item => item.id === params.get("scene"))), step = Math.max(0, Number(params.get("step") || 0));
let theme = params.get("theme") === "dark" ? "dark" : "light", token = 0, playing = false, timer = null, ready = false;
$("count").textContent = scenes.reduce((total, scene) => total + scene.steps.length, 0);
$("scene-count").textContent = scenes.length;
function pause() { playing = false; clearTimeout(timer); timer = null; $("play").textContent = "▶ 播放全部流程"; }
function arm() { clearTimeout(timer); if (playing && ready) timer = setTimeout(() => {
  if (step + 1 < scenes[sceneIndex].steps.length) show(sceneIndex, step + 1);
  else if (sceneIndex + 1 < scenes.length) show(sceneIndex + 1, 0);
  else { pause(); $("top-status").textContent = "全部流程播放完成"; }
}, 3800); }
function show(index, selected = 0) {
  clearTimeout(timer); sceneIndex = index; step = Math.min(scenes[index].steps.length - 1, Math.max(0, selected));
  window.scrollTo({ top: 0, behavior: "instant" });
  const scene = scenes[index], stage = scene.steps[step]; ready = false; token++;
  frame.style.height = "";
  $("title").textContent = scene.title; $("counter").textContent = `${step + 1} / ${scene.steps.length}`;
  $("note").textContent = stage.note; $("loader").hidden = false; $("loader").classList.remove("error");
  $("top-status").textContent = playing ? "正在播放" : "可交互预览";
  $("scenes").innerHTML = scenes.map((item, i) => `<button class="scene" data-scene="${item.id}" aria-pressed="${i === index}"><span class="number">${String(i + 1).padStart(2, "0")}</span><span><strong>${item.title}</strong><small>${item.caption}</small></span></button>`).join("");
  for (const [i, button] of [...$("scenes").querySelectorAll("button")].entries()) button.onclick = () => { pause(); show(i, 0); };
  $("steps").innerHTML = scene.steps.map((item, i) => `<button class="step" data-step="${i}" ${i === step ? 'aria-current="step"' : ""}>${i + 1}. ${item.label}</button>`).join("");
  for (const [i, button] of [...$("steps").querySelectorAll("button")].entries()) button.onclick = () => { pause(); show(sceneIndex, i); };
  $("previous").disabled = step === 0; $("next").disabled = step === scene.steps.length - 1;
  frame.src = `/fixture.html?${new URLSearchParams({ scene: scene.id, step: String(step), theme, token: String(token) })}`;
  history.replaceState(null, "", `?${new URLSearchParams({ scene: scene.id, step: String(step), theme })}`);
}
$("previous").onclick = () => { pause(); show(sceneIndex, step - 1); };
$("next").onclick = () => { pause(); show(sceneIndex, step + 1); };
$("theme").onclick = () => { theme = theme === "light" ? "dark" : "light"; $("theme").textContent = theme === "light" ? "切换深色" : "切换浅色"; show(sceneIndex, step); };
$("play").onclick = () => { if (playing) pause(); else { playing = true; $("play").textContent = "Ⅱ 暂停播放"; show(0, 0); } };
window.addEventListener("message", event => {
  const data = event.data;
  if (event.origin !== location.origin || event.source !== frame.contentWindow || data?.source !== "shoggoth-group-preview" || data.token !== String(token)) return;
  if (data.type === "ready") { frame.style.height = Math.max(740, data.result.requiredHeight + 12) + "px"; ready = true; $("loader").hidden = true; window.previewResult = data.result; arm(); }
  if (data.type === "error") { $("loader").textContent = data.text; $("loader").classList.add("error"); }
  if (data.type === "action" && data.action === "stop-group") { pause(); show(scenes.findIndex(item => item.id === "group-stop"), 1); }
});
window.groupPreview = {
  scenes, show(id, selected) { pause(); show(scenes.findIndex(item => item.id === id), selected); },
  state: () => ({ scene: scenes[sceneIndex].id, step, theme, ready, playing, result: window.previewResult }),
};
$("theme").textContent = theme === "light" ? "切换深色" : "切换浅色";
show(sceneIndex, step);
</script>
</html>
