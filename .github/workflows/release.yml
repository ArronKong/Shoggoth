name: Signed macOS draft
run-name: ${{ inputs.release_mode == 'publish' && 'Publish signed macOS' || 'Validate signed draft' }} ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed tag at the selected workflow commit
        required: true
        type: string
      release_mode:
        description: Draft only, or authorize automatic publication after all acceptance gates
        required: true
        type: choice
        default: draft
        options: [draft, publish]
      notes_file:
        description: Reviewed release-notes/v<VERSION>.md in this tag; required for publish (English then Chinese)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: shoggoth-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Draft release visibility requires write permission.
      actions: read # Read the exact public main CI result when available.
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      source_ci_run_id: ${{ steps.existing-ci.outputs.run_id }}
      source_ci_run_attempt: ${{ steps.existing-ci.outputs.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.22.3"
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Freeze reviewed public source and reject published releases
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
          RELEASE_MODE: ${{ inputs.release_mode }}
          RELEASE_NOTES_FILE: ${{ inputs.notes_file }}
        run: |
          test "$REPOSITORY_VISIBILITY" = "public"
          export RELEASE_SOURCE_SHA="$(git rev-parse HEAD)"
          node scripts/release-draft.cjs validate
          node scripts/release-publication.cjs intent
          echo "sha=$RELEASE_SOURCE_SHA" >> "$GITHUB_OUTPUT"
          npm run export:source -- "$RUNNER_TEMP/shoggoth-release-source"
          node scripts/check-release-private-keys.cjs "$RUNNER_TEMP/shoggoth-release-source"
          node scripts/check-connector-public-release.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-intent
          path: release-intent.json
          if-no-files-found: error
      - name: Look up CI for the exact public main commit
        id: existing-ci
        timeout-minutes: 29
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: node scripts/release-source-ci.cjs

  source-ci:
    needs: validate
    if: needs.validate.outputs.source_ci_run_id == ''
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    name: Sign and notarize ${{ matrix.arch }}
    needs: [validate, source-ci]
    if: >-
      !cancelled() && needs.validate.result == 'success' &&
      (needs.source-ci.result == 'success' ||
       (needs.source-ci.result == 'skipped' && needs.validate.outputs.source_ci_run_id != ''))
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
            app_dir: mac-arm64
            zip_suffix: arm64-mac
          - arch: x64
            runner: macos-15-intel
            app_dir: mac
            zip_suffix: mac
    runs-on: ${{ matrix.runner }}
    environment: macos-signing
    timeout-minutes: 180
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
      BUILD_ARCH: ${{ matrix.arch }}
      SHOGGOTH_CODESIGN_MODE: developer-id
      SHOGGOTH_RELEASE_DISTRIBUTION: official
      SHOGGOTH_CODESIGN_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      SHOGGOTH_NOTARY_KEYCHAIN_PROFILE: shoggoth-release
      SHOGGOTH_EXPECT_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      SHOGGOTH_EXPECT_NOTARIZED: "1"
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.22.3"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/manage-ui/package-lock.json
      - name: Require native hardware and all signing credentials
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          node -e 'require("node:assert/strict").equal(process.arch, process.env.BUILD_ARCH)'
          missing=0
          for name in MACOS_CERTIFICATE_BASE64 MACOS_CERTIFICATE_PASSWORD SHOGGOTH_EXPECT_TEAM_ID SHOGGOTH_CODESIGN_IDENTITY; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Release secret missing: $name"
              missing=1
            fi
          done
          if [[ -z "$APPLE_API_KEY_BASE64" || -z "$APPLE_API_KEY_ID" || -z "$APPLE_API_ISSUER" ]]; then
            if [[ -z "$APPLE_ID" || -z "$APPLE_APP_SPECIFIC_PASSWORD" ]]; then
              echo "::error::Provide complete App Store Connect API credentials or Apple ID with an app-specific password"
              missing=1
            fi
          fi
          test "$missing" = 0
      - name: Verify the pinned Xcode and Icon Composer toolchain
        run: |
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
          xcrun actool --version
          xcodebuild -version | head -n 1 | grep -Fx 'Xcode 26.3'
      - name: Install locked dependencies and restore Electron licenses
        run: |
          npm ci --ignore-scripts
          npm --prefix app/manage-ui ci --ignore-scripts
          node scripts/ci-install-electron.cjs
          test -s node_modules/electron/dist/LICENSE
          test -s node_modules/electron/dist/LICENSES.chromium.html
      - name: Run update, signing, and package contracts
        run: |
          node scripts/desktop-app-update-unit.cjs
          node scripts/app-update-release-contract-unit.cjs
          node --test scripts/release-draft-unit.cjs
          node --test scripts/release-stapler-unit.cjs
          node scripts/check-release-private-keys-unit.cjs
          node scripts/adhoc-sign-unit.cjs
          node scripts/release-package-checks-unit.cjs
          node scripts/notarize-unit.cjs
      - name: Prepare pinned build inputs
        run: |
          npm run build:manage
          npm run prepare:runtimes
          node scripts/release-package-checks.cjs preflight
          npm run release:metadata
          npm run licenses:check
      - name: Import Developer ID certificate and Notary credentials
        shell: bash
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          KEYCHAIN_PATH="$RUNNER_TEMP/shoggoth-release.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          CERTIFICATE_PATH="$RUNNER_TEMP/shoggoth-release.p12"
          API_KEY_PATH="$RUNNER_TEMP/shoggoth-notary.p8"
          node <<'NODE'
          const fs = require('node:fs');
          const { execFileSync } = require('node:child_process');
          const list = execFileSync('security', ['list-keychains', '-d', 'user'], { encoding: 'utf8' });
          const paths = [...list.matchAll(/"([^"]+)"/g)].map(match => match[1]);
          if (!paths.length) throw new Error('Cannot preserve the original keychain search list');
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/shoggoth-keychain-search-list.json`, JSON.stringify(paths), { mode: 0o600, flag: 'wx' });
          NODE
          printf '%s' "$MACOS_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          chmod 600 "$CERTIFICATE_PATH"
          echo "SHOGGOTH_RELEASE_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          node <<'NODE'
          const fs = require('node:fs');
          const { execFileSync } = require('node:child_process');
          const paths = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/shoggoth-keychain-search-list.json`, 'utf8'));
          execFileSync('security', ['list-keychains', '-d', 'user', '-s', ...paths, `${process.env.RUNNER_TEMP}/shoggoth-release.keychain-db`]);
          NODE
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null
          # These are public Apple intermediates, verified by digest; never alter trust settings.
          curl --fail --silent --show-error --location --retry 3 https://www.apple.com/certificateauthority/DeveloperIDCA.cer -o "$RUNNER_TEMP/DeveloperIDCA.cer"
          curl --fail --silent --show-error --location --retry 3 https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$RUNNER_TEMP/DeveloperIDG2CA.cer"
          printf '%s  %s\n' '7afc9d01a62f03a2de9637936d4afe68090d2de18d03f29c88cfb0b1ba63587f' "$RUNNER_TEMP/DeveloperIDCA.cer" | shasum -a 256 -c -
          printf '%s  %s\n' 'f16cd3c54c7f83cea4bf1a3e6a0819c8aaa8e4a1528fd144715f350643d2df3a' "$RUNNER_TEMP/DeveloperIDG2CA.cer" | shasum -a 256 -c -
          security import "$RUNNER_TEMP/DeveloperIDCA.cer" -k "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$KEYCHAIN_PATH"
          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const keychain = `${process.env.RUNNER_TEMP}/shoggoth-release.keychain-db`;
          const listing = execFileSync('security', ['find-identity', '-v', '-p', 'codesigning', keychain], { encoding: 'utf8' });
          const expected = process.env.SHOGGOTH_CODESIGN_IDENTITY;
          const team = process.env.SHOGGOTH_EXPECT_TEAM_ID;
          const identities = [...listing.matchAll(/^\s*\d+\) ([A-F0-9]{40}) "([^"]+)"/gm)];
          const matches = identities.filter(([, hash, name]) => (hash === expected.toUpperCase() || name === expected)
            && name.startsWith('Developer ID Application: ') && name.endsWith(`(${team})`));
          if (matches.length !== 1) throw new Error('The configured Developer ID is not a unique valid signing identity in the temporary keychain');
          console.log('Configured Developer ID and Team ID validated in the temporary keychain.');
          NODE
          printf 'int main(void) { return 0; }\n' > "$RUNNER_TEMP/shoggoth-signing-probe.c"
          xcrun clang "$RUNNER_TEMP/shoggoth-signing-probe.c" -o "$RUNNER_TEMP/shoggoth-signing-probe"
          codesign --force --options runtime --timestamp --keychain "$KEYCHAIN_PATH" --sign "$SHOGGOTH_CODESIGN_IDENTITY" "$RUNNER_TEMP/shoggoth-signing-probe"
          codesign --verify --strict "$RUNNER_TEMP/shoggoth-signing-probe"
          if [[ -n "$APPLE_API_KEY_BASE64" && -n "$APPLE_API_KEY_ID" && -n "$APPLE_API_ISSUER" ]]; then
            printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$API_KEY_PATH"
            xcrun notarytool store-credentials "$SHOGGOTH_NOTARY_KEYCHAIN_PROFILE" \
              --key "$API_KEY_PATH" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" \
              --keychain "$KEYCHAIN_PATH"
          else
            xcrun notarytool store-credentials "$SHOGGOTH_NOTARY_KEYCHAIN_PROFILE" \
              --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" \
              --team-id "$SHOGGOTH_EXPECT_TEAM_ID" --keychain "$KEYCHAIN_PATH"
          fi
          rm -f "$CERTIFICATE_PATH" "$API_KEY_PATH"
          echo "SHOGGOTH_CODESIGN_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "SHOGGOTH_NOTARY_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"


      - name: Use TCP HTTPS on the hosted Intel runner
        if: matrix.arch == 'x64'
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = macOS
          test "$RUNNER_ARCH" = X64
          # actions/runner-images#14924: HTTP/3 ticket lookups can lose connections.
          # Use a private anchor; preserve the runner's existing PF rules.
          sudo /sbin/pfctl -sr > "$RUNNER_TEMP/shoggoth-pf-original.txt"
          grep -E '^anchor "com[.]apple/[*]"' "$RUNNER_TEMP/shoggoth-pf-original.txt"
          touch "$RUNNER_TEMP/shoggoth-pf-anchor-created"
          printf '%s\n' 'block return out quick proto udp from any to any port 443' |
            sudo /sbin/pfctl -a com.apple/shoggoth-notary -f -
          sudo /sbin/pfctl -E 2> "$RUNNER_TEMP/shoggoth-pf-enable.txt"
          grep -E '^Token[[:space:]]*:[[:space:]]*[0-9]+$' "$RUNNER_TEMP/shoggoth-pf-enable.txt"
          sudo /sbin/pfctl -a com.apple/shoggoth-notary -sr

      - name: Build and notarize this architecture
        run: node scripts/release-build.cjs
      - name: Upload signed architecture assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-${{ matrix.arch }}
          path: |
            dist/*-${{ matrix.zip_suffix }}.zip
            dist/*-${{ matrix.zip_suffix }}.zip.blockmap
            dist/*-${{ matrix.arch }}.dmg
            dist/latest-mac.yml
            dist/build-receipt.json
          if-no-files-found: error
          compression-level: 0
          overwrite: true
      - name: Preserve signing and source evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signing-${{ matrix.arch }}-attempt-${{ github.run_attempt }}
          path: |
            dist/${{ matrix.app_dir }}/Shoggoth.app.notarization.json
            dist/signing-${{ matrix.arch }}/*.json
          if-no-files-found: warn
      - name: Remove temporary signing credentials
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/shoggoth-release.p12" "$RUNNER_TEMP/shoggoth-notary.p8"
          node <<'NODE'
          const fs = require('node:fs');
          const { execFileSync } = require('node:child_process');
          const saved = `${process.env.RUNNER_TEMP}/shoggoth-keychain-search-list.json`;
          if (fs.existsSync(saved)) {
            execFileSync('security', ['list-keychains', '-d', 'user', '-s', ...JSON.parse(fs.readFileSync(saved, 'utf8'))]);
            fs.unlinkSync(saved);
          }
          NODE
          if [[ -n "${SHOGGOTH_RELEASE_KEYCHAIN:-}" && -f "$SHOGGOTH_RELEASE_KEYCHAIN" ]]; then
            security delete-keychain "$SHOGGOTH_RELEASE_KEYCHAIN"
          fi
          rm -f "$RUNNER_TEMP/DeveloperIDCA.cer" "$RUNNER_TEMP/DeveloperIDG2CA.cer" "$RUNNER_TEMP/shoggoth-signing-probe.c" "$RUNNER_TEMP/shoggoth-signing-probe"

      - name: Remove the hosted Intel transport workaround
        if: always() && matrix.arch == 'x64'
        run: |
          set -euo pipefail
          if [[ -f "$RUNNER_TEMP/shoggoth-pf-anchor-created" ]]; then
            sudo /sbin/pfctl -a com.apple/shoggoth-notary -F rules
          fi
          if [[ -f "$RUNNER_TEMP/shoggoth-pf-enable.txt" ]]; then
            PF_REFERENCE="$(awk '/^Token[[:space:]]*:/ {print $NF}' "$RUNNER_TEMP/shoggoth-pf-enable.txt")"
            if [[ "$PF_REFERENCE" =~ ^[0-9]+$ ]]; then
              sudo /sbin/pfctl -X "$PF_REFERENCE"
            fi
          fi

  draft:
    needs: [validate, build]
    if: "!cancelled() && needs.validate.result == 'success' && needs.build.result == 'success'"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.upload.outputs.release_id }}
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.22.3"
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: signed-*
          path: artifacts
      - name: Merge architecture metadata and verify build receipts
        run: node scripts/release-draft.cjs assemble
      - name: Create or resume the matching draft without replacing assets
        id: upload
        run: node scripts/release-draft.cjs upload
      - name: Verify all uploaded bytes
        env:
          RELEASE_ID: ${{ steps.upload.outputs.release_id }}
        run: node scripts/release-draft.cjs verify draft-upload.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: draft-upload
          overwrite: true
          path: draft-upload.json
          if-no-files-found: error

  native-verification:
    needs: [validate, draft]
    if: "!cancelled() && needs.validate.result == 'success' && needs.draft.result == 'success'"
    uses: ./.github/workflows/verify-signed-draft.yml
    permissions:
      contents: write
    with:
      tag: ${{ inputs.tag }}
      release_id: ${{ needs.draft.outputs.release_id }}
      source_sha: ${{ needs.validate.outputs.source_sha }}

  accepted-draft:
    needs: [validate, draft, native-verification]
    if: >-
      !cancelled() && needs.validate.result == 'success' && needs.draft.result == 'success' &&
      needs.native-verification.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    outputs:
      receipt_artifact: ${{ steps.confirm.outputs.receipt_artifact }}
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
      RELEASE_ID: ${{ needs.draft.outputs.release_id }}
      RELEASE_SOURCE_CI_RUN_ID: ${{ needs.validate.outputs.source_ci_run_id }}
      RELEASE_SOURCE_CI_RUN_ATTEMPT: ${{ needs.validate.outputs.source_ci_run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.22.3"
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: draft-upload
      - name: Confirm the verified asset identities after native verification
        id: confirm
        run: |
          node scripts/release-draft.cjs confirm
          echo "Signed draft $RELEASE_TAG passed source CI and both native verification jobs." >> "$GITHUB_STEP_SUMMARY"
          echo "Release ID $RELEASE_ID accepted; publication follows only when explicitly selected at dispatch." >> "$GITHUB_STEP_SUMMARY"
          echo "receipt_artifact=accepted-draft-attempt-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: accepted-draft-attempt-${{ github.run_attempt }}
          path: accepted-draft.json
          if-no-files-found: error

  publish:
    if: >-
      !cancelled() && inputs.release_mode == 'publish' && needs.validate.result == 'success' &&
      needs.draft.result == 'success' && needs.accepted-draft.result == 'success'
    needs: [validate, draft, accepted-draft]
    concurrency:
      group: shoggoth-release-publication
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
      pull-requests: read
    outputs:
      receipt_artifact: ${{ steps.publish.outputs.receipt_artifact }}
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
      RELEASE_MODE: ${{ inputs.release_mode }}
      RELEASE_NOTES_FILE: ${{ inputs.notes_file }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.22.3"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/manage-ui/package-lock.json
      - name: Install locked audit tools without lifecycle scripts
        run: |
          npm ci --ignore-scripts
          npm --prefix app/manage-ui ci --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-intent
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.accepted-draft.outputs.receipt_artifact }}
      - name: Refresh both dependency audits immediately before publication
        run: |
          mkdir -p publication
          node scripts/dependency-audit-policy.cjs --output publication/audit-root.json
          node scripts/dependency-audit-policy.cjs --directory app/manage-ui --output publication/audit-ui.json
      - name: Publish accepted immutable assets
        id: publish
        run: |
          node scripts/release-publication.cjs publish
          echo "receipt_artifact=publication-attempt-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: publication-attempt-${{ github.run_attempt }}
          path: publication/*.json
          if-no-files-found: warn

  verify-public:
    needs: [validate, publish]
    if: "!cancelled() && needs.validate.result == 'success' && needs.publish.result == 'success'"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.22.3"
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.publish.outputs.receipt_artifact }}
          path: publication
      - name: Verify anonymous downloads for the published release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
          RELEASE_MODE: ${{ inputs.release_mode }}
        run: node scripts/release-publication.cjs verify-public
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: public-verification-attempt-${{ github.run_attempt }}
          path: |
            publication/public-verification.json
            publication/public-verification-status.json
          if-no-files-found: warn

  result:
    if: always()
    needs: [validate, source-ci, build, draft, native-verification, accepted-draft, publish, verify-public]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Record the final stage results
        env:
          RESULTS: ${{ toJSON(needs) }}
          RELEASE_MODE: ${{ inputs.release_mode }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const results = JSON.parse(process.env.RESULTS);
          const rows = Object.entries(results).map(([name, job]) => `| ${name} | ${job.result} |`);
          const ciRun = results.validate.outputs?.source_ci_run_id;
          const ci = ciRun ? `Source CI reused from [main](https://github.com/${process.env.GITHUB_REPOSITORY}/actions/runs/${ciRun}).\n\n` : '';
          const state = results.publish.result === 'success' && results['verify-public'].result !== 'success'
            ? 'Release is public. Public download verification is pending; retry only the verify-public job.\n'
            : '';
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            `Requested mode: **${process.env.RELEASE_MODE || 'draft'}**\n\n| Stage | Result |\n| --- | --- |\n${rows.join('\n')}\n\n` +
            ci + state + 'For an interrupted publication, consult the existing Release ID and publication receipt before retrying.\n');
          NODE
