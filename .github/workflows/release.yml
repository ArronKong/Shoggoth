name: Signed macOS release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed release tag to build
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: shoggoth-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos-release:
    runs-on: macos-latest
    timeout-minutes: 180
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      SHOGGOTH_CODESIGN_MODE: developer-id
      SHOGGOTH_CODESIGN_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      SHOGGOTH_NOTARY_KEYCHAIN_PROFILE: shoggoth-release
      SHOGGOTH_EXPECT_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      SHOGGOTH_EXPECT_NOTARIZED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.3"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/manage-ui/package-lock.json

      - name: Validate public release inputs
        shell: bash
        env:
          REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          test "$REPOSITORY_VISIBILITY" = "public" || { echo "Release blocked: GitHub updater requires a public repository." >&2; exit 1; }
          case "$RELEASE_TAG" in v*) ;; *) echo "Release tag must start with v." >&2; exit 1 ;; esac
          PACKAGE_VERSION="$(node -p 'require("./package.json").version')"
          test "$RELEASE_TAG" = "v$PACKAGE_VERSION" || { echo "Tag/version mismatch: $RELEASE_TAG != v$PACKAGE_VERSION" >&2; exit 1; }
          if gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' > "$RUNNER_TEMP/existing-release-state" 2>/dev/null; then
            grep -x true "$RUNNER_TEMP/existing-release-state" > /dev/null \
              || { echo "Release blocked: $RELEASE_TAG is already published." >&2; exit 1; }
          fi
          for value in MACOS_CERTIFICATE_BASE64 MACOS_CERTIFICATE_PASSWORD APPLE_API_KEY_BASE64 APPLE_API_KEY_ID APPLE_API_ISSUER APPLE_TEAM_ID SHOGGOTH_CODESIGN_IDENTITY; do
            test -n "${!value:-}" || { echo "Release secret missing: $value" >&2; exit 1; }
          done

      - name: Install locked dependencies
        run: |
          npm ci --ignore-scripts
          npm --prefix app/manage-ui ci --ignore-scripts

      - name: Restore Electron license files
        run: |
          node node_modules/electron/install.js
          test -s node_modules/electron/dist/LICENSE
          test -s node_modules/electron/dist/LICENSES.chromium.html

      - name: Run update, signing, and UI contracts
        run: |
          npm --prefix app/manage-ui exec -- tsc --noEmit --project app/manage-ui/tsconfig.json
          node scripts/desktop-app-update-unit.cjs
          node scripts/app-update-release-contract-unit.cjs
          node scripts/adhoc-sign-unit.cjs
          node scripts/notarize-unit.cjs
          npm audit --audit-level=moderate
          npm --prefix app/manage-ui audit --audit-level=moderate

      - name: Import Developer ID certificate and Notary credentials
        shell: bash
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/shoggoth-release.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          CERTIFICATE_PATH="$RUNNER_TEMP/shoggoth-release.p12"
          API_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$MACOS_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$API_KEY_PATH"
          chmod 600 "$CERTIFICATE_PATH" "$API_KEY_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          xcrun notarytool store-credentials "$SHOGGOTH_NOTARY_KEYCHAIN_PROFILE" \
            --key "$API_KEY_PATH" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" \
            --keychain "$KEYCHAIN_PATH"
          echo "SHOGGOTH_CODESIGN_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "SHOGGOTH_NOTARY_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "SHOGGOTH_RELEASE_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Build, notarize, and upload draft artifacts
        run: |
          npm run build:manage
          npm run prepare:runtimes
          npm run release:metadata
          npm run licenses:check
          npx electron-builder --mac --publish always

      - name: Create, notarize, and upload architecture-specific DMGs
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p 'require("./package.json").version')"
          for ARCH in arm64 x64; do
            node scripts/create-macos-dmg.mjs --arch "$ARCH" --distribution official
            DMG="dist/Shoggoth-${VERSION}-${ARCH}.dmg"
            xcrun notarytool submit "$DMG" \
              --keychain-profile "$SHOGGOTH_NOTARY_KEYCHAIN_PROFILE" \
              --keychain "$SHOGGOTH_NOTARY_KEYCHAIN" \
              --wait --output-format json > "$RUNNER_TEMP/shoggoth-dmg-${ARCH}-notary.json"
            node -e 'const fs=require("node:fs"); const r=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if(r.status!=="Accepted") process.exit(1)' \
              "$RUNNER_TEMP/shoggoth-dmg-${ARCH}-notary.json"
            xcrun stapler staple "$DMG"
            xcrun stapler validate "$DMG"
          done
          (
            cd dist
            shasum -a 256 \
              "Shoggoth-${VERSION}-arm64-mac.zip" \
              "Shoggoth-${VERSION}-mac.zip" \
              "Shoggoth-${VERSION}-arm64.dmg" \
              "Shoggoth-${VERSION}-x64.dmg" > SHA256SUMS.txt
          )
          gh release upload "$RELEASE_TAG" \
            "dist/Shoggoth-${VERSION}-arm64.dmg" \
            "dist/Shoggoth-${VERSION}-x64.dmg" \
            dist/SHA256SUMS.txt --clobber

      - name: Verify signed packages and updater metadata
        run: |
          node scripts/verify-app-update-release.mjs
          node scripts/shoggoth-packaged-runtime-smoke.mjs --spike-arm64
          VERSION="$(node -p 'require("./package.json").version')"
          (cd dist && shasum -a 256 -c SHA256SUMS.txt)
          for ARCH in arm64 x64; do
            DMG="dist/Shoggoth-${VERSION}-${ARCH}.dmg"
            hdiutil verify "$DMG"
            xcrun stapler validate "$DMG"
          done
          ASSETS="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"
          for NAME in \
            "Shoggoth-${VERSION}-arm64-mac.zip" \
            "Shoggoth-${VERSION}-mac.zip" \
            "Shoggoth-${VERSION}-arm64.dmg" \
            "Shoggoth-${VERSION}-x64.dmg" \
            latest-mac.yml SHA256SUMS.txt; do
            printf '%s\n' "$ASSETS" | grep -Fx "$NAME"
          done
          gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' | grep -x true

      - name: Remove temporary signing keychain
        if: always()
        shell: bash
        run: |
          if [[ -n "${SHOGGOTH_RELEASE_KEYCHAIN:-}" && -f "$SHOGGOTH_RELEASE_KEYCHAIN" ]]; then
            security delete-keychain "$SHOGGOTH_RELEASE_KEYCHAIN" || true
          fi
          rm -f "$RUNNER_TEMP"/shoggoth-release.p12 "$RUNNER_TEMP"/AuthKey_*.p8

  verify-x64-and-publish:
    needs: macos-release
    runs-on: macos-15-intel
    timeout-minutes: 120
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      SHOGGOTH_EXPECT_NOTARIZED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.3"
          cache: npm

      - name: Prepare exact source and Intel runtime
        run: |
          npm ci --ignore-scripts
          npm run prepare:runtimes

      - name: Download and verify notarized Intel assets
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p 'require("./package.json").version')"
          gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' | grep -x true
          mkdir -p dist/mac
          gh release download "$RELEASE_TAG" --pattern "Shoggoth-${VERSION}-mac.zip" --dir dist
          gh release download "$RELEASE_TAG" --pattern "Shoggoth-${VERSION}-x64.dmg" --dir dist
          ditto -x -k "dist/Shoggoth-${VERSION}-mac.zip" dist/mac
          node scripts/shoggoth-packaged-runtime-smoke.mjs --spike-x64
          hdiutil verify "dist/Shoggoth-${VERSION}-x64.dmg"
          xcrun stapler validate "dist/Shoggoth-${VERSION}-x64.dmg"

      - name: Publish verified release
        run: gh release edit "$RELEASE_TAG" --draft=false --latest --verify-tag
