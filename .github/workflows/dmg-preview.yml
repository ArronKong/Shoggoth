name: Build macOS DMG previews

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    env:
      SHOGGOTH_CODESIGN_MODE: adhoc
      SHOGGOTH_RELEASE_DISTRIBUTION: internal
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.3"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/manage-ui/package-lock.json

      - name: Install locked dependencies
        run: |
          npm ci --ignore-scripts
          npm --prefix app/manage-ui ci --ignore-scripts

      - name: Restore Electron license files
        run: |
          node node_modules/electron/install.js
          test -s node_modules/electron/dist/LICENSE
          test -s node_modules/electron/dist/LICENSES.chromium.html

      - name: Build and check native architecture
        run: |
          npm run build:manage
          npm run prepare:runtimes
          npm run release:metadata
          npm run licenses:check
          npx electron-builder --mac --${{ matrix.arch }} --publish never
          node scripts/shoggoth-packaged-runtime-smoke.mjs --spike-${{ matrix.arch }}

      - name: Create and verify internal DMGs
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p 'require("./package.json").version')"
          node scripts/create-macos-dmg.mjs --arch "${{ matrix.arch }}" --distribution internal
          hdiutil verify "dist/Shoggoth-${VERSION}-${{ matrix.arch }}.dmg"

      - name: Upload checked preview images
        uses: actions/upload-artifact@v4
        with:
          name: Shoggoth-${{ github.sha }}-${{ matrix.arch }}-internal-DMG
          path: dist/Shoggoth-*-${{ matrix.arch }}.dmg
          if-no-files-found: error
          retention-days: 7

  assemble:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.3"

      - uses: actions/download-artifact@v4
        with:
          pattern: Shoggoth-${{ github.sha }}-*-internal-DMG
          path: dist
          merge-multiple: true

      - name: Verify both images and checksums
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p 'require("./package.json").version')"
          test -s "dist/Shoggoth-${VERSION}-arm64.dmg"
          test -s "dist/Shoggoth-${VERSION}-x64.dmg"
          (
            cd dist
            sha256sum \
              "Shoggoth-${VERSION}-arm64.dmg" \
              "Shoggoth-${VERSION}-x64.dmg" > SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt
          )

      - name: Upload paired DMGs
        uses: actions/upload-artifact@v4
        with:
          name: Shoggoth-${{ github.sha }}-internal-DMGs
          path: |
            dist/Shoggoth-*-arm64.dmg
            dist/Shoggoth-*-x64.dmg
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
