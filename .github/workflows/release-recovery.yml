name: Recover hosted release capacity

on:
  workflow_run:
    workflows: [Signed macOS draft]
    types: [completed]

permissions:
  contents: read
  actions: write
  checks: read

concurrency:
  group: shoggoth-release-recovery-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  recover:
    if: github.event.workflow_run.event == 'workflow_dispatch' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      # Always execute the trusted default-branch controller, never source/artifacts from the failed run.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.22.3"
      - name: Recover only proven allocation failures and report final failures
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-recovery.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: release-recovery-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}-observer-${{ github.run_attempt }}
          path: release-recovery.json
          if-no-files-found: warn
