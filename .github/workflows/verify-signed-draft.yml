name: Verify notarized macOS draft
run-name: Verify signed draft ${{ inputs.tag }} / ${{ inputs.request_id || github.run_id }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Draft release tag matching package.json
        required: true
        type: string
      release_id:
        description: Numeric ID of the draft release
        required: true
        type: string
      request_id:
        description: Local release operation ID for matching its verification run
        required: false
        type: string

  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      release_id:
        required: true
        type: string
      source_sha:
        required: true
        type: string
      request_id:
        required: false
        type: string

permissions:
  contents: write

jobs:
  macos:
    name: Native ${{ matrix.arch }} draft verification
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
            app_dir: mac
            zip_suffix: mac
            binary_arch: x86_64
            evidence: intel
          - arch: arm64
            runner: macos-latest
            app_dir: mac-arm64
            zip_suffix: arm64-mac
            binary_arch: arm64
            evidence: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      SHOGGOTH_EXPECT_TEAM_ID: MK3JHXWR7H
      SHOGGOTH_EXPECT_NOTARIZED: "1"
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      SHOGGOTH_DRAFT_ARCH: ${{ matrix.arch }}
      SHOGGOTH_DRAFT_APP_SUBDIR: ${{ matrix.app_dir }}
      SHOGGOTH_DRAFT_ZIP_SUFFIX: ${{ matrix.zip_suffix }}
      SHOGGOTH_DRAFT_BINARY_ARCH: ${{ matrix.binary_arch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_sha || inputs.tag }}
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.22.3"
          cache: npm

      - name: Verify first-launch harness and preserve tagged product source
        env:
          VERIFICATION_HARNESS_SHA: ${{ github.sha }}
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs'), path = require('node:path');
          const { createHash } = require('node:crypto');
          const { execFileSync } = require('node:child_process');
          assert.equal(process.arch, process.env.SHOGGOTH_DRAFT_ARCH);
          const git = args => execFileSync('git', args, { encoding: 'utf8', timeout: 120000 }).trim();
          const source = git(['rev-parse', 'HEAD']);
          if (process.env.EXPECTED_SOURCE_SHA) assert.equal(source, process.env.EXPECTED_SOURCE_SHA);
          const harness = process.env.VERIFICATION_HARNESS_SHA;
          assert.match(harness, /^[a-f0-9]{40}$/);
          if (source !== harness) git(['fetch', '--no-tags', '--depth=1', 'origin', harness]);
          const changedPaths = git(['diff', '--name-only', source, harness]).split('\n').filter(Boolean).sort();
          const allowed = ['.github/workflows/verify-signed-draft.yml',
            'scripts/shoggoth-quarantined-first-launch.cjs', 'scripts/shoggoth-quarantined-first-launch-unit.cjs',
            'scripts/shoggoth-memory-batch-smoke.cjs', 'scripts/shoggoth-active-memory-diagnostics-regression.cjs',
            'scripts/shoggoth-packaged-runtime-smoke.mjs', 'scripts/release-stapler.cjs', 'scripts/release-stapler-unit.cjs',
            'scripts/app-update-release-contract-unit.cjs'];
          assert.ok(changedPaths.every(name => allowed.includes(name)), 'Harness differs in product or unrelated files');
          const hashes = {};
          for (const name of allowed.slice(1)) {
            const bytes = execFileSync('git', ['show', `${harness}:${name}`]);
            hashes[name] = createHash('sha256').update(bytes).digest('hex');
            fs.writeFileSync(name, bytes);
          }
          execFileSync(process.execPath, ['--test', allowed[2]], { stdio: 'inherit', timeout: 30000 });
          execFileSync(process.execPath, ['--test', 'scripts/release-stapler-unit.cjs'], { stdio: 'inherit', timeout: 30000 });
          assert.equal(git(['rev-parse', 'HEAD']), source);
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'verification-harness.json'), JSON.stringify({
            sourceCommit: source, harnessCommit: harness, architecture: process.arch,
            changedPaths, hashes, unitTestsPassed: true, taggedProductSourcePreserved: true,
          }, null, 2) + '\n', { flag: 'wx' });
          NODE

      - name: Install dependencies and pinned runtimes
        run: |
          node -e 'require("node:assert/strict").equal(process.arch, process.env.SHOGGOTH_DRAFT_ARCH, "Draft verification requires native hardware")'
          npm ci --ignore-scripts
          npm run prepare:runtimes

      - name: Download exact draft assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ inputs.release_id }}
        run: |
          set -euo pipefail
          VERSION="$(node -p 'require("./package.json").version')"
          test "$RELEASE_TAG" = "v$VERSION"
          mkdir -p "dist/$SHOGGOTH_DRAFT_APP_SUBDIR"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { createReadStream, createWriteStream, statSync } from 'node:fs';
          import { pipeline } from 'node:stream/promises';
          import { execFileSync } from 'node:child_process';
          import { Readable } from 'node:stream';

          const version = JSON.parse((await import('node:fs')).readFileSync('package.json', 'utf8')).version;
          const arch = process.env.SHOGGOTH_DRAFT_ARCH;
          assert.ok(['arm64', 'x64'].includes(arch));
          const zipSuffix = arch === 'arm64' ? 'arm64-mac' : 'mac';
          const base = `https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}`;
          const headers = {
            Authorization: `Bearer ${process.env.GH_TOKEN}`,
            Accept: 'application/vnd.github+json',
            'X-GitHub-Api-Version': '2022-11-28',
          };
          const listResponse = await fetch(`${base}/releases?per_page=100`, { headers });
          assert.equal(listResponse.status, 200, 'Cannot list releases with workflow token');
          const releases = await listResponse.json();
          let release = releases.find(item => item.id === Number(process.env.RELEASE_ID));
          if (!release) {
            const getResponse = await fetch(`${base}/releases/${process.env.RELEASE_ID}`, { headers });
            assert.equal(getResponse.status, 200, 'Cannot get draft release by ID with workflow token');
            release = await getResponse.json();
          }
          assert.ok(release, 'Draft release is not visible to the workflow token');
          assert.equal(release.tag_name, process.env.RELEASE_TAG, 'Release ID does not match requested tag');
          assert.equal(release.draft, true, 'Release is already published');
          const sourceCommit = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          assert.match(sourceCommit, /^[a-f0-9]{40}$/);
          assert.equal(release.target_commitish, sourceCommit, 'Draft target differs from the checked out version tag');
          for (const name of [`Shoggoth-${version}-${zipSuffix}.zip`, `Shoggoth-${version}-${arch}.dmg`, 'SHA256SUMS.txt', 'latest-mac.yml', `Shoggoth-${version}-${zipSuffix}.zip.blockmap`]) {
            const asset = release.assets.find(item => item.name === name);
            assert.ok(asset, `Missing draft asset: ${name}`);
            const response = await fetch(`${base}/releases/assets/${asset.id}`, {
              headers: { ...headers, Accept: 'application/octet-stream' },
            });
            assert.equal(response.status, 200, `Cannot download draft asset: ${name}`);
            assert.ok(response.body && !response.headers.get('content-type')?.includes('json'));
            const destination = `dist/${name}`;
            await pipeline(Readable.fromWeb(response.body), createWriteStream(destination));
            assert.equal(statSync(destination).size, asset.size, `Size mismatch: ${name}`);
            if (asset.digest) {
              const hash = createHash('sha256');
              for await (const chunk of createReadStream(destination)) hash.update(chunk);
              assert.equal(`sha256:${hash.digest('hex')}`, asset.digest, `SHA256 mismatch: ${name}`);
            }
            console.log(`Verified draft asset: ${name}`);
          }
          NODE
          (
            cd dist
            awk -v name="Shoggoth-${VERSION}-${SHOGGOTH_DRAFT_ZIP_SUFFIX}.zip" '$2 == name {print; matches++} END {if (matches != 1) exit 1}' SHA256SUMS.txt | shasum -a 256 -c -
            awk -v name="Shoggoth-${VERSION}-${SHOGGOTH_DRAFT_ARCH}.dmg" '$2 == name {print; matches++} END {if (matches != 1) exit 1}' SHA256SUMS.txt | shasum -a 256 -c -
          )
          ditto -x -k "dist/Shoggoth-${VERSION}-${SHOGGOTH_DRAFT_ZIP_SUFFIX}.zip" "dist/$SHOGGOTH_DRAFT_APP_SUBDIR"

      - name: Verify App and DMG on native hardware
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p 'require("./package.json").version')"
          APP="$GITHUB_WORKSPACE/dist/$SHOGGOTH_DRAFT_APP_SUBDIR/Shoggoth.app"
          DMG="dist/Shoggoth-${VERSION}-${SHOGGOTH_DRAFT_ARCH}.dmg"
          node scripts/verify-app-update-release.mjs --arch "$SHOGGOTH_DRAFT_ARCH"
          node scripts/shoggoth-packaged-runtime-smoke.mjs "--spike-$SHOGGOTH_DRAFT_ARCH"
          node scripts/shoggoth-memory-e5-packaged.cjs --app "$APP" --output "$RUNNER_TEMP/e5-$SHOGGOTH_DRAFT_ARCH-result.json"
          hdiutil verify "$DMG"
          node scripts/release-stapler.cjs validate "$DMG"
          MOUNT="$RUNNER_TEMP/shoggoth-$SHOGGOTH_DRAFT_ARCH-dmg"
          mkdir -p "$MOUNT"
          trap 'hdiutil detach "$MOUNT" >/dev/null 2>&1 || true' EXIT
          hdiutil attach -readonly -nobrowse -mountpoint "$MOUNT" "$DMG"
          test "$(lipo -archs "$MOUNT/Shoggoth.app/Contents/MacOS/Shoggoth")" = "$SHOGGOTH_DRAFT_BINARY_ARCH"
          codesign --verify --deep --strict "$MOUNT/Shoggoth.app"
          codesign -dv --verbose=4 "$MOUNT/Shoggoth.app" 2>&1 |
            grep -Fx "TeamIdentifier=$SHOGGOTH_EXPECT_TEAM_ID"
          node scripts/release-stapler.cjs validate "$MOUNT/Shoggoth.app"
          spctl --assess --type execute --verbose=4 "$MOUNT/Shoggoth.app"
          cmp "$APP/Contents/Resources/app.asar" "$MOUNT/Shoggoth.app/Contents/Resources/app.asar"

      - name: Normal quarantined first launch on the empty hosted account
        run: node scripts/shoggoth-quarantined-first-launch.cjs --app "$GITHUB_WORKSPACE/dist/$SHOGGOTH_DRAFT_APP_SUBDIR/Shoggoth.app" --output "$RUNNER_TEMP/shoggoth-first-launch"

      - name: Preserve first-launch evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.evidence }}-quarantined-first-launch-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/shoggoth-first-launch/
            ${{ runner.temp }}/e5-${{ matrix.arch }}-result.json
            ${{ runner.temp }}/verification-harness.json
          if-no-files-found: error
